<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>3D Axis | Experience Center - Luminous Edition</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <style>
        .ui-overlay {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 100; color: #fff; text-align: center; font-family: 'Segoe UI', sans-serif;
            pointer-events: none; text-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <h2>تحرك لاستكشاف بوابات 3D Axis المضيئة</h2>
        <p>مساحة صغيرة لراحة الزوار • تحرك باللمس أو WASD</p>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false" renderer="antialias: true">
        <a-sky color="#fff" emissive="#fff" emissiveIntensity="0.1"></a-sky>

        <a-box id="room" position="0 2 0" scale="10 4 10" color="#f7f7f7" material="side: back; emissive: #f7f7f7; emissiveIntensity: 0.1">
            <a-plane position="0 0 -4.9" width="10" height="4" color="#FFD1DC" material="emissive: #FFD1DC; emissiveIntensity: 0.8; side: double"></a-plane> <a-plane position="0 0 4.9" rotation="0 180 0" width="10" height="4" color="#FFD1DC" material="emissive: #FFD1DC; emissiveIntensity: 0.8; side: double"></a-plane> <a-plane position="-4.9 0 0" rotation="0 90 0" width="10" height="4" color="#FFD1DC" material="emissive: #FFD1DC; emissiveIntensity: 0.8; side: double"></a-plane> <a-plane position="4.9 0 0" rotation="0 -90 0" width="10" height="4" color="#FFD1DC" material="emissive: #FFD1DC; emissiveIntensity: 0.8; side: double"></a-plane> <a-plane position="0 2 0" rotation="90 0 0" width="10" height="10" color="#fff" material="emissive: #fff; emissiveIntensity: 0.9; side: double"></a-plane>
            
            <a-plane position="0 -2 0" rotation="-90 0 0" width="10" height="10" color="#C0C0C0" material="emissive: #C0C0C0; emissiveIntensity: 0.6; roughness: 0.1; metalness: 0.7; side: double"></a-plane>
        </a-box>

        <a-light type="ambient" intensity="1" color="#fff"></a-light>
        <a-light type="directional" position="0 5 0" intensity="0.5" color="#fff"></a-light>

        <a-entity position="-2 0 -2.5">
            <a-torus color="#d4af37" material="emissive: #d4af37; emissiveIntensity: 1.2" radius="1.2" radius-tubular="0.06" animation="property: rotation; to: 0 360 0; dur: 5000; loop: true; easing: linear"></a-torus>
            <a-text value="🏢 LUXURY REAL ESTATE" position="0 2 0" align="center" color="#d4af37" width="5"></a-text>
            <a-text value="🏢 العقارات الفخمة" position="0 1.6 0" align="center" color="#d4af37" width="5"></a-text>
            <a-box position="0 0.8 0" scale="1.5 2.5 0.1" material="color: #d4af37; opacity: 0.4; transparent: true; emissive: #d4af37; emissiveIntensity: 0.5"></a-box>
        </a-entity>

        <a-entity position="2 0 -2.5">
            <a-torus color="#d4af37" material="emissive: #d4af37; emissiveIntensity: 1.2" radius="1.2" radius-tubular="0.06" animation="property: rotation; to: 0 360 0; dur: 5000; loop: true; easing: linear"></a-torus>
            <a-text value="🎓 PARALLEL EDUCATION" position="0 2 0" align="center" color="#d4af37" width="5"></a-text>
            <a-text value="🎓 التعليم الموازي" position="0 1.6 0" align="center" color="#d4af37" width="5"></a-text>
            <a-box position="0 0.8 0" scale="1.5 2.5 0.1" material="color: #d4af37; opacity: 0.4; transparent: true; emissive: #d4af37; emissiveIntensity: 0.5"></a-box>
        </a-entity>

        <a-entity position="-2 0 1.5" rotation="0 90 0">
            <a-torus color="#d4af37" material="emissive: #d4af37; emissiveIntensity: 1.2" radius="1.2" radius-tubular="0.06" animation="property: rotation; to: 0 360 0; dur: 5000; loop: true; easing: linear"></a-torus>
            <a-text value="🛒 SMART MARKET" position="0 2 0" align="center" color="#d4af37" width="5"></a-text>
            <a-text value="🛒 الماركت الذكي" position="0 1.6 0" align="center" color="#d4af37" width="5"></a-text>
        </a-entity>

        <a-entity position="2 0 1.5" rotation="0 -90 0">
            <a-torus color="#d4af37" material="emissive: #d4af37; emissiveIntensity: 1.2" radius="1.2" radius-tubular="0.06" animation="property: rotation; to: 0 360 0; dur: 5000; loop: true; easing: linear"></a-torus>
            <a-text value="🚀 AD AGENCY" position="0 2 0" align="center" color="#d4af37" width="5"></a-text>
            <a-text value="🚀 وكالة الإعلانات" position="0 1.6 0" align="center" color="#d4af37" width="5"></a-text>
        </a-entity>

        <a-entity id="rig" movement-controls="speed: 0.1" position="0 0 0">
            <a-entity camera look-controls position="0 1.6 0"></a-entity>
        </a-entity>

    </a-scene>

</body>
</html>
