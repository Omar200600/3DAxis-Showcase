<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>معرض ثري دي أكسيس العقاري</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <!-- السماء -->
        <a-sky color="#ECECEC"></a-sky>

        <!-- الأرضية (رخام) -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#f0f0f0" metalness="0.6"></a-plane>

        <!-- الجدران (مع تقسيم الديكور الذي طلبته) -->
        <a-box position="0 2 -5" width="10" height="4" depth="0.1" color="#2c3e50"></a-box> <!-- جدار أمامي -->
        <a-box position="-5 2 0" width="0.1" height="4" depth="10" color="#bdc3c7"></a-box> <!-- جدار أيسر -->
        <a-box position="5 2 0" width="0.1" height="4" depth="10" color="#bdc3c7"></a-box> <!-- جدار أيمن -->

        <!-- مجسم بسيط (طاولة عرض) حتى نجد المجسم الاحترافي -->
        <a-box position="0 0.5 -2" width="2" height="1" depth="1" color="#d4af37" metalness="0.8"></a-box>

        <!-- إضاءة فخمة -->
        <a-light type="ambient" color="#fff"></a-light>
        <a-light type="point" intensity="1" position="2 4 -3"></a-light>

        <a-entity camera look-controls position="0 1.6 3"></a-entity>
    </a-scene>
</body>
</html>
