<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Axis | بوابة المستقبل</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        /* واجهة التحكم */
        .overlay-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; z-index: 10; pointer-events: none;
            background: rgba(0,0,0,0.5);
        }

        .container { pointer-events: auto; text-align: center; width: 90%; }
        
        h1 { color: #d4af37; font-size: 2.5rem; text-shadow: 0 0 15px #d4af37; margin-bottom: 30px; }

        /* شبكة الأزرار الذكية */
        .grid-menu {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            max-width: 500px; margin: 0 auto;
        }

        .nav-card {
            padding: 20px; background: rgba(255,255,255,0.05);
            border: 1px solid #d4af37; border-radius: 15px;
            color: #fff; text-decoration: none; transition: 0.3s;
            font-weight: bold; font-size: 1rem;
        }

        .nav-card:hover {
            background: #d4af37; color: #000; box-shadow: 0 0 25px #d4af37;
            transform: scale(1.05);
        }

        .footer-text { color: rgba(255,255,255,0.5); margin-top: 30px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="overlay-ui">
        <div class="container">
            <h1>3D AXIS PORTAL</h1>
            
            <div class="grid-menu">
                <a href="#" class="nav-card">🏢 المباني والعقارات</a>
                <a href="#" class="nav-card">🎓 الفصول الذكية</a>
                <a href="#" class="nav-card">📢 قسم الإعلانات</a>
                <a href="#" class="nav-card">🛒 الماركت والسوق</a>
            </div>

            <p class="footer-text">جميع الحقوق محفوظة لمشروع 3D Axis © 2026</p>
        </div>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false">
        <a-sky color="#020202"></a-sky>
        
        <a-entity position="0 0 -5">
            <a-sphere position="2 2 0" radius="0.05" color="#d4af37" animation="property: position; to: -2 -2 0; dur: 4000; loop: true; dir: alternate"></a-sphere>
            <a-sphere position="-2 3 -2" radius="0.03" color="#fff" animation="property: position; to: 2 -1 -2; dur: 6000; loop: true; dir: alternate"></a-sphere>
            <a-sphere position="0 1 -3" radius="0.04" color="#d4af37" animation="property: scale; to: 2 2 2; dur: 3000; loop: true; dir: alternate"></a-sphere>
        </a-entity>

        <a-light type="ambient" intensity="0.7"></a-light>
        <a-entity camera look-controls position="0 1.6 3"></a-entity>
    </a-scene>

</body>
</html>
