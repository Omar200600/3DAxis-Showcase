<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D AXIS | معرض الأعمال العالمي</title>
    <style>
        :root {
            --gold: #d4af37;
            --silver: #C0C0C0;
            --pink-light: #FFD1DC;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fff 0%, var(--pink-light) 100%);
            overflow-x: hidden;
        }

        /* تأثير اللمعان الخلفي */
        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(212,175,55,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .container {
            max-width: 1000px; margin: 0 auto; padding: 40px 20px;
            text-align: center; position: relative; z-index: 1;
        }

        header h1 {
            color: var(--gold); font-size: 3.5rem; margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1); font-weight: 900;
        }

        header p {
            color: #555; font-size: 1.2rem; margin-bottom: 50px; font-weight: bold;
        }

        /* شبكة البوابات */
        .grid-portals {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px; margin-top: 20px;
        }

        .portal-card {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid var(--gold); border-radius: 20px;
            padding: 30px 20px; text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            backdrop-filter: blur(5px);
        }

        .portal-card:hover {
            transform: translateY(-15px);
            background: var(--gold);
            box-shadow: 0 20px 40px rgba(212,175,55,0.3);
        }

        .portal-card .icon { font-size: 3rem; margin-bottom: 15px; }
        
        .portal-card h3 { color: #333; margin: 10px 0 5px; font-size: 1.4rem; }
        .portal-card span { color: #666; font-size: 0.9rem; font-weight: bold; }

        .portal-card:hover h3, .portal-card:hover span { color: #fff; }

        /* زر تبديل اللغة */
        .lang-switch {
            position: absolute; top: 20px; left: 20px;
            background: var(--gold); color: white; border: none;
            padding: 10px 20px; border-radius: 50px; cursor: pointer;
            font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        footer { margin-top: 60px; color: #888; font-size: 0.9rem; }

        /* تأثيرات لماعة للأزرار */
        .portal-card::after {
            content: ''; position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg); transition: 0.5s;
        }
        .portal-card:hover::after { left: 100%; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    
    <button class="lang-switch" onclick="toggleLang()">English</button>

    <div class="container">
        <header>
            <h1 id="title">3D AXIS</h1>
            <p id="subtitle">بوابة المستقبل للاستثمار والابتكار الرقمي</p>
        </header>

        <div class="grid-portals">
            <a href="./realestate/index.html" class="portal-card">
                <div class="icon">🏢</div>
                <h3 id="p1-ar">العقارات الفخمة</h3>
                <span id="p1-en">Luxury Real Estate</span>
            </a>

            <a href="./education/index.html" class="portal-card">
                <div class="icon">🎓</div>
                <h3 id="p2-ar">التعليم الموازي</h3>
                <span id="p2-en">Parallel Education</span>
            </a>

            <a href="./market/index.html" class="portal-card">
                <div class="icon">🛒</div>
                <h3 id="p3-ar">الماركت الذكي</h3>
                <span id="p3-en">Smart Market</span>
            </a>

            <a href="./ads/index.html" class="portal-card">
                <div class="icon">🚀</div>
                <h3 id="p4-ar">وكالة الإعلانات</h3>
                <span id="p4-en">Ad Agency</span>
            </a>
        </div>

        <footer>
            <p id="footer-text">حقوق الطبع والمشروع محفوظة لـ 3D AXIS © 2026</p>
        </footer>
    </div>

    <script>
        let isAr = true;
        function toggleLang() {
            isAr = !isAr;
            const btn = document.querySelector('.lang-switch');
            const title = document.getElementById('title');
            const subtitle = document.getElementById('subtitle');
            
            if(!isAr) {
                document.documentElement.dir = "ltr";
                btn.innerText = "عربي";
                title.innerText = "3D AXIS SHOWCASE";
                subtitle.innerText = "The Future Gateway for Investment & Innovation";
                document.getElementById('footer-text').innerText = "All rights reserved to 3D AXIS Project © 2026";
            } else {
                document.documentElement.dir = "rtl";
                btn.innerText = "English";
                title.innerText = "3D AXIS";
                subtitle.innerText = "بوابة المستقبل للاستثمار والابتكار الرقمي";
                document.getElementById('footer-text').innerText = "حقوق الطبع والمشروع محفوظة لـ 3D AXIS © 2026";
            }
        }
    </script>
</body>
</html>
