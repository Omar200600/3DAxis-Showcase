<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D AXIS | Virtual Gateway</title>
    <style>
        body {
            margin: 0; background: #0a0a0a; color: #d4af37;
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        /* خلفية النجوم المتحركة */
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            z-index: -1;
        }
        h1 { font-size: 3rem; text-shadow: 0 0 20px #d4af37; margin-bottom: 40px; }

        .button-container {
            display: flex; flex-direction: column; gap: 30px; width: 80%; max-width: 400px;
        }

        .btn-gold {
            background: transparent; border: 2px solid #d4af37; color: #d4af37;
            padding: 20px; font-size: 1.2rem; border-radius: 15px; cursor: pointer;
            text-decoration: none; text-align: center; font-weight: bold;
            transition: 0.3s; box-shadow: 0 0 10px rgba(212,175,55,0.2);
        }

        .btn-gold:active { transform: scale(0.95); background: #d4af37; color: #000; }
    </style>
</head>
<body>
    <div class="stars"></div>
    <h1>3D AXIS</h1>
    <div class="button-container">
        <a href="./realestate/index.html" class="btn-gold">🏢 العقارات الفخمة | Real Estate</a>
        <a href="./education/index.html" class="btn-gold">🎓 التعليم الموازي | Education</a>
        <a href="./market/index.html" class="btn-gold">🛒 الماركت الذكي | Market</a>
    </div>
</body>
</html>
