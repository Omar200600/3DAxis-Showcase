<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Axis | عالم الفخامة الرقمية</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; font-family: sans-serif; overflow: hidden; }
        
        /* طبقة العناوين */
        .main-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; z-index: 100; pointer-events: none;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.9) 100%);
        }

        .content-box {
            text-align: center; pointer-events: auto;
            padding: 20px; border-radius: 20px;
        }

        h1 { color: #d4af37; font-size: 3rem; margin: 0; text-shadow: 0 0 20px #d4af37; }
        p { color: #fff; font-size: 1.2rem; margin: 15px 0; opacity: 0.8; }

        .btn-gold {
            display: inline-block; padding: 12px 35px;
            background: transparent; color: #d4af37;
            border: 2px solid #d4af37; border-radius: 50px;
            text-decoration: none; font-weight: bold;
            transition: 0.3s; cursor: pointer;
        }

        .btn-gold:hover { background: #d4af37; color: #000; box-shadow: 0 0 30px #d4af37; }

        /* جعل العرض يتناسب مع الشاشات */
        a-scene { width: 100%; height: 100vh; }
    </style>
</head>
<body>

    <div class="main-ui">
        <div class="content-box">
            <h1>3D AXIS WORLD</h1>
            <p>بوابتك الفاخرة للاستثمار في الميتافيرس</p>
            <br>
            <a href="#showroom" class="btn-gold">ابدأ التجربة الآن</a>
        </div>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false">
        <a-sky color="#050505"></a-sky>

        <a-entity position="0 0 -6" animation="property: rotation; to: 0 360 0; dur: 15000; loop: true; easing: linear">
            <a-cylinder position="0 -1 0" radius="2" height="0.2" color="#d4af37" metalness="1"></a-cylinder>
            
            <a-cone position="0 1 0" radius-bottom="1" height="4" color="#007bff" opacity="0.6" metalness="0.5">
                <a-light type="point" intensity="1" color="#007bff"></a-light>
            </a-cone>

            <a-torus position="0 1 0" rotation="90 0 0" radius="1.5" radius-tubular="0.01" color="#d4af37"></a-torus>
        </a-entity>

        <a-light type="ambient" intensity="0.6" color="#fff"></a-light>
        <a-light type="directional" position="1 2 1" intensity="0.5"></a-light>

        <a-entity camera look-controls position="0 1.6 4"></a-entity>
    </a-scene>

</body>
</html>
