<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Axis | بوابة المستقبل الذهبي</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body { margin: 0; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        .overlay-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; z-index: 10; pointer-events: none;
        }

        .container { pointer-events: auto; text-align: center; width: 90%; max-width: 600px; }
        
        h1 { 
            color: #d4af37; font-size: 3rem; text-shadow: 0 0 30px rgba(212,175,55,0.8); 
            margin-bottom: 40px; font-weight: 900; letter-spacing: 2px;
        }

        .grid-menu {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
        }

        .nav-card {
            padding: 25px 10px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            color: #fff; text-decoration: none; transition: 0.5s;
            font-weight: bold; font-size: 1.1rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .nav-card:hover {
            background: rgba(212, 175, 55, 0.2);
            border-color: #d4af37;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
            transform: translateY(-10px);
        }

        .nav-card i { font-size: 2rem; margin-bottom: 10px; display: block; }
        
        .status-bar {
            margin-top: 40px; color: #d4af37; font-size: 0.9rem;
            border-top: 1px solid rgba(212, 175, 55, 0.2); padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="overlay-ui">
        <div class="container">
            <h1>3D AXIS</h1>
            
            <div class="grid-menu">
                <a href="real-estate.html" class="nav-card">
                    <span>🏢</span> العقارات الفخمة
                </a>
                <a href="#" class="nav-card">
                    <span>🎓</span> التعليم الموازي
                </a>
                <a href="#" class="nav-card">
                    <span>💎</span> الماركت الذكي
                </a>
                <a href="#" class="nav-card">
                    <span>🚀</span> وكالة الإعلانات
                </a>
            </div>

            <div class="status-bar">
                النظام يعمل بالذكاء الاصطناعي الكامل • 2026
            </div>
        </div>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false">
        <a-sky color="#000"></a-sky>
        
        <a-light type="point" color="#d4af37" intensity="2" distance="50" animation="property: position; from: -10 10 -10; to: 10 -10 10; dur: 10000; loop: true; dir: alternate"></a-light>

        <a-entity position="0 0 -10">
            <a-ocean color="#0a0a0a" width="50" depth="50" density="20" speed="2"></a-ocean>
            <a-sphere position="5 5 0" radius="0.1" color="#fff" animation="property: position; to: -5 -5 -20; dur: 3000; loop: true; easing: linear"></a-sphere>
            <a-sphere position="-8 2 -5" radius="0.05" color="#d4af37" animation="property: position; to: 8 10 -15; dur: 5000; loop: true; easing: linear"></a-sphere>
            <a-sphere position="0 -5 -2" radius="0.08" color="#007bff" animation="property: position; to: 0 15 -10; dur: 4000; loop: true; easing: linear"></a-sphere>
        </a-entity>

        <a-light type="ambient" intensity="0.4"></a-light>
        <a-entity camera look-controls position="0 1.6 3"></a-entity>
    </a-scene>

</body>
</html>
