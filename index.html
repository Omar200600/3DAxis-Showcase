
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>3D Axis | The Royal Lobby</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
</head>
<body>

    <a-scene renderer="colorManagement: true; exposure: 1.2;">
        
        <a-sky color="#f0f0f0"></a-sky>

        <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
        <a-light type="directional" position="1 4 2" intensity="0.6" target="#room"></a-light>

        <a-entity id="room">
            <a-plane rotation="-90 0 0" width="12" height="12" color="#C0C0C0" metalness="0.5" roughness="0.2"></a-plane>
            
            <a-plane position="0 4 0" rotation="90 0 0" width="12" height="12" color="#ffffff"></a-plane>

            <a-plane position="0 2 -6" width="12" height="4" color="#FFB6C1"></a-plane> <a-plane position="0 2 6" rotation="0 180 0" width="12" height="4" color="#FFB6C1"></a-plane> <a-plane position="-6 2 0" rotation="0 90 0" width="12" height="4" color="#FFB6C1"></a-plane> <a-plane position="6 2 0" rotation="0 -90 0" width="12" height="4" color="#FFB6C1"></a-plane> </a-entity>

        <a-entity position="-3 1.2 -4">
            <a-torus color="#D4AF37" radius="1.2" radius-tubular="0.08" animation="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear"></a-torus>
            <a-text value="LUXURY REAL ESTATE" position="0 2.2 0" align="center" color="#000" width="4"></a-text>
            <a-text value="العقارات الفخمة" position="0 1.8 0" align="center" color="#D4AF37" font="https://cdn.aframe.io/fonts/Cairo.fnt" width="5"></a-text>
        </a-entity>

        <a-entity position="3 1.2 -4">
            <a-torus color="#D4AF37" radius="1.2" radius-tubular="0.08" animation="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear"></a-torus>
            <a-text value="PARALLEL EDUCATION" position="0 2.2 0" align="center" color="#000" width="4"></a-text>
            <a-text value="التعليم الموازي" position="0 1.8 0" align="center" color="#D4AF37" width="5"></a-text>
        </a-entity>

        <a-entity id="rig" movement-controls="fly: false; speed: 0.2">
            <a-entity camera look-controls="pointerLockEnabled: false" position="0 1.6 0">
                <a-cursor color="#D4AF37"></a-cursor>
            </a-entity>
        </a-entity>

    </a-scene>

</body>
</html>
