<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Axis - Celestial Gateway</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #0d1b2a 0%, #000000 100%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            color: white;
        }

        /* فضاء النجوم المتحركة */
        .stars-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* النجمة المركزية النابضة */
        .center-star {
            position: absolute;
            width: 140px;
            height: 140px;
            background: #00f2ff;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            box-shadow: 0 0 60px #00f2ff, 0 0 120px #00f2ff;
            z-index: 2;
            animation: heartBeat 2s infinite ease-in-out;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); filter: brightness(1); }
            15% { transform: scale(1.2); filter: brightness(1.8); }
            30% { transform: scale(1); filter: brightness(1); }
            45% { transform: scale(1.15); filter: brightness(1.6); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        /* المدار */
        .orbit {
            position: relative;
            width: 650px;
            height: 650px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: rotateOrbit 40s linear infinite;
            z-index: 3;
        }

        @keyframes rotateOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* الكرات الذهبية ثلاثية الأبعاد */
        .sphere-btn {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            /* تأثير الكرة ثلاثي الأبعاد باستخدام التدرج الشعاعي */
            background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b 60%, #5d4506 100%);
            box-shadow: inset -10px -10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(212, 175, 55, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: counterRotate 40s linear infinite;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        @keyframes counterRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* محتوى الكرة (النص) */
        .sphere-content {
            text-align: center;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .sphere-content .ar {
            display: block;
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .sphere-content .en {
            display: block;
            font-size: 14px;
            font-weight: bold;
            opacity: 0.9;
            letter-spacing: 0.5px;
        }

        /* التوهج القوي عند الضغط */
        .sphere-btn:active {
            transform: scale(0.95);
            filter: brightness(2) saturate(1.5);
            box-shadow: 0 0 80px #ffffff, inset 0 0 20px #ffffff;
        }

        .sphere-btn:hover {
            box-shadow: 0 0 40px #ffd700, inset 0 0 10px #ffffff;
            transform: scale(1.1);
        }

        /* توزيع الكواكب على المدار */
        .pos-1 { top: 0; left: 50%; transform: translate(-50%, -50%); } /* الإعلانات - أعلى */
        .pos-2 { bottom: 0; left: 50%; transform: translate(-50%, 50%); } /* التعليم - أسفل */
        .pos-3 { left: 0; top: 50%; transform: translate(-50%, -50%); } /* العقارات - يسار */
        .pos-4 { right: 0; top: 50%; transform: translate(50%, -50%); } /* التجارة - يمين */

        /* زر اللغة */
        .lang-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 25px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ffd700;
            color: #ffd700;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            transition: 0.3s;
        }

        .lang-toggle:hover {
            background: #ffd700;
            color: black;
        }
    </style>
</head>
<body>

    <div class="stars-container" id="stars"></div>
    
    <div class="center-star"></div>

    <div class="orbit">
        <div class="sphere-btn pos-1" onclick="console.log('Ads')">
            <div class="sphere-content">
                <span class="ar">الإعلانات<br>والعروض العالمية</span>
                <span class="en">Global Ads & Offers</span>
            </div>
        </div>

        <div class="sphere-btn pos-2" onclick="console.log('Education')">
            <div class="sphere-content">
                <span class="ar">التعليم<br>الموازي والافتراضي</span>
                <span class="en">Parallel & Virtual Education</span>
            </div>
        </div>

        <div class="sphere-btn pos-3" onclick="console.log('Real Estate')">
            <div class="sphere-content">
                <span class="ar">العقارات<br>والمدن المستدامة</span>
                <span class="en">Real Estate & Sustainable Cities</span>
            </div>
        </div>

        <div class="sphere-btn pos-4" onclick="console.log('Commerce')">
            <div class="sphere-content">
                <span class="ar">التجارة العالمية<br>والخدمات</span>
                <span class="en">Global Commerce & Services</span>
            </div>
        </div>
    </div>

    <button class="lang-toggle">English / عربي</button>

    <script>
        // إنشاء خلفية النجوم المتحركة
        function createStars() {
            const container = document.getElementById('stars');
            const starCount = 200;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                const size = Math.random() * 2 + 1;
                star.style.position = 'absolute';
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.background = '#fff';
                star.style.borderRadius = '50%';
                star.style.top = Math.random() * 100 + '%';
                star.style.left = Math.random() * 100 + '%';
                star.style.opacity = Math.random();
                star.style.boxShadow = `0 0 ${size * 2}px #fff`;
                
                star.animate([
                    { opacity: 0.2, transform: 'scale(0.8)' },
                    { opacity: 1, transform: 'scale(1.2)' }
                ], {
                    duration: 2000 + Math.random() * 3000,
                    iterations: Infinity,
                    direction: 'alternate'
                });
                
                container.appendChild(star);
            }
        }
        createStars();
    </script>
</body>
</html>
