<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Axis | مستقبل الأعمال الافتراضية</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #000; overflow: hidden; }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            z-index: 10; pointer-events: none; padding: 50px 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);
        }
        .header { text-align: center; pointer-events: auto; }
        h1 { color: #d4af37; font-size: 4rem; margin: 0; text-shadow: 0 0 20px rgba(212,175,55,0.5); font-weight: 900; }
        p { color: #fff; font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; opacity: 0.8; }
        .footer { pointer-events: auto; }
        .btn {
            padding: 15px 40px; background: transparent; color: #d4af37;
            border: 2px solid #d4af37; border-radius: 50px; font-size: 1.2rem;
            cursor: pointer; transition: 0.4s; font-weight: bold; text-decoration: none;
        }
        .btn:hover { background: #d4af37; color: #000; box-shadow: 0 0 30px #d4af37; }
    </style>
</head>
<body>

    <div class="overlay">
        <div class="header">
            <h1>3D AXIS WORLD</h1>
            <p>حيث يلتقي الخيال بالثروة والذكاء</p>
        </div>
        
        <div class="footer">
            <a href="real-estate.html" class="btn">استكشف العروض العقارية</a>
        </div>
    </div>

    <a-scene embedded vr-mode-ui="enabled: false">
        <a-sky color="#050505"></a-sky>
        
        <a-entity position="0 0 0">
            <a-sphere position="5 5 -10" radius="0.05" color="#fff" animation="property: position; to: 5 -5 -10; dur: 5000; loop: true; dir: alternate"></a-sphere>
            <a-sphere position="-3 2 -8" radius="0.03" color="#d4af37" animation="property: position; to: -3 6 -8; dur: 7000; loop: true; dir: alternate"></a-sphere>
            <a-sphere position="0 -2 -12" radius="0.04" color="#007bff" animation="property: position; to: 2 4 -12; dur: 6000; loop: true; dir: alternate"></a-sphere>
        </a-entity>

        <a-entity position="0 0 -5" animation="property: rotation; to: 0 360 0; dur: 20000; easing: linear; loop: true">
            <a-cylinder color="#111" height="0.5" radius="2" metalness="0.9"></a-cylinder>
            <a-cone color="#d4af37" height="4" radius-bottom="0.8" radius-top="0" opacity="0.7" position="0 2 0" metalness="1" roughness="0.1">
                <a-light type="point" color="#d4af37" intensity="1"></a-light>
            </a-cone>
            <a-torus color="#007bff" arc="360" radius="1.5" radius-tubular="0.02" rotation="90 0 0" animation="property: rotation; to: 90 360 0; dur: 5000; loop: true; easing: linear"></a-torus>
        </a-entity>

        <a-light type="ambient" intensity="0.5"></a-light>
        <a-light type="directional" position="1 1 1" intensity="0.8" color="#fff"></a-light>
        
        <a-entity camera look-controls position="0 1.6 3"></a-entity>
    </a-scene>

</body>
</html>
